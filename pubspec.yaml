name: pinka_ai
description: PINKA Ai Android app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  file_picker: ^8.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/pinka_logo.png

flutter_launcher_icons:
  android: true
  image_path: assets/images/pinka_logo.png
  adaptive_icon_background: '#120A12'
  adaptive_icon_foreground: assets/images/pinka_logo.png
